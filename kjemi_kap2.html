<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kjemiske bindinger – kapittel 2 (Naturfag SF)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F9; --grid:rgba(30,60,110,.07); --card:#FFFFFF; --ink:#132033; --muted:#526379; --line:#D3DCE6;
  --focus:#1B5EF0; --ok:#0F7A49; --okbg:#E2F4EA; --no:#B3261E; --nobg:#FCE9E7;
  --factbg:#FFF3CF; --factline:#E4C86E; --chip:#E8EEF5; --soft:#F6F8FB;
  --h-atom:#2F62C9; --h-okt:#6B43C2; --h-ion:#A96200; --h-kov:#16825A; --h-navn:#B02D78;
  --h-met:#506070; --h-mix:#0B7C9C; --h-hms:#C23B30; --h-quiz:#1E2D45; --h-fasit:#3D4B5C; --h-home:#1E2D45;
  --fh:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fb:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1622; --grid:rgba(140,170,220,.06); --card:#162131; --ink:#E7EEF6; --muted:#A0B1C5; --line:#2B3B50;
    --focus:#7AA7FF; --ok:#62D79B; --okbg:#12352A; --no:#FF8F86; --nobg:#3C1D1B;
    --factbg:#3A3218; --factline:#6E5E22; --chip:#22324A; --soft:#1B2A3E;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1622; --grid:rgba(140,170,220,.06); --card:#162131; --ink:#E7EEF6; --muted:#A0B1C5; --line:#2B3B50;
  --focus:#7AA7FF; --ok:#62D79B; --okbg:#12352A; --no:#FF8F86; --nobg:#3C1D1B;
  --factbg:#3A3218; --factline:#6E5E22; --chip:#22324A; --soft:#1B2A3E;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{margin:0;background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;color:var(--ink);font:400 17px/1.55 var(--fb);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--fh);line-height:1.15;margin:0;letter-spacing:-.01em}
p{margin:0 0 .7em}
a{color:var(--focus)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
sub,sup{line-height:0;font-size:.72em}
.skip{position:absolute;left:-999px;top:8px;background:var(--card);padding:8px 12px;z-index:100;border-radius:8px}
.skip:focus{left:8px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:calc(100vh - env(safe-area-inset-top,0px));
  overflow:auto;padding:20px 12px 24px;background:var(--card);border-right:1px solid var(--line);height:100vh}
.brand{display:block;padding:4px 10px 14px;text-decoration:none;color:var(--ink)}
.brand b{font:800 1.25rem/1.1 var(--fh);display:block}
.brand span{font-size:.85rem;color:var(--muted)}
.nav ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.nav a.item{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:7px 10px;border-radius:12px;
  text-decoration:none;color:var(--ink);font-size:.95rem;line-height:1.2}
.nav a.item:hover{background:var(--soft)}
.nav a.item[aria-current="page"]{background:color-mix(in srgb,var(--hue) 14%,var(--card));font-weight:700}
.nav .mini{width:38px;height:38px;border-radius:9px;background:var(--hue);color:#fff;display:grid;place-items:center;
  font:800 1rem/1 var(--fh);position:relative}
.nav .mini small{position:absolute;top:2px;left:4px;font:500 .55rem/1 var(--fh);opacity:.85}
.nav .cnt{font-size:.8rem;color:var(--muted);white-space:nowrap}
.nav .sep{height:1px;background:var(--line);margin:10px 8px}
.nav .reset{margin:14px 10px 0;font-size:.85rem;background:none;border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer;color:var(--muted);width:calc(100% - 20px)}
.nav .reset:hover{border-color:var(--no);color:var(--no)}
.topbar{display:none}
main{padding:30px clamp(16px,4vw,52px) 90px;max-width:1360px;width:100%}
@media (max-width:900px){
  .app{display:block}
  .nav{position:fixed;left:0;top:0;bottom:0;width:min(310px,88vw);z-index:60;transform:translateX(-104%);transition:transform .22s;height:auto;max-height:none;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .nav.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(10,20,35,.5);z-index:55}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--card);border-bottom:1px solid var(--line);padding:8px 14px}
  .topbar button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:700}
  .topbar b{font:800 1.05rem var(--fh)}
  main{padding-top:20px}
}

/* ---------- tiles ---------- */
.tile{background:var(--hue);color:#fff;border-radius:12px;display:grid;place-items:center;position:relative;aspect-ratio:1;overflow:hidden}
.tile .z{position:absolute;top:7px;left:9px;font:500 .8rem/1 var(--fh);opacity:.9}
.tile .s{font:800 2.6rem/1 var(--fh)}

/* ---------- home ---------- */
.hero{max-width:820px;margin-bottom:26px}
.hero h1{font-size:clamp(2rem,5vw,3.3rem);font-weight:800;margin-bottom:12px}
.hero p{font-size:1.12rem;color:var(--muted);max-width:60ch}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:0 0 30px;padding:0;list-style:none}
.steps li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.steps b{display:block;font-family:var(--fh);margin-bottom:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tcard{display:grid;grid-template-columns:84px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.tcard:hover{border-color:var(--hue);transform:translateY(-2px)}
.tcard .tile{width:84px}
.tcard .tile .s{font-size:2rem}
.tcard h3{font-size:1.05rem;margin:2px 0 4px}
.tcard p{font-size:.88rem;color:var(--muted);margin:0 0 8px;line-height:1.35}
.bar{height:7px;background:var(--chip);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hue);border-radius:9px;transition:width .3s}
.bartxt{font-size:.78rem;color:var(--muted);margin-top:3px}
.note{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:14px 18px;margin-top:26px;max-width:820px}

/* ---------- section ---------- */
.sec{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.sec-head{display:grid;grid-template-columns:96px 1fr;gap:20px;align-items:center;margin-bottom:22px;grid-column:1/-1}
.sec-head .tile{width:96px}
.sec-head h1{font-size:clamp(1.6rem,3.6vw,2.4rem);font-weight:800;margin-bottom:6px}
.sec-head p{margin:0;color:var(--muted);max-width:66ch}
.sec-head .prog{margin-top:10px;display:flex;gap:12px;align-items:center;max-width:420px}
.sec-head .prog .bar{flex:1}
.sec-head .prog span{font-size:.88rem;color:var(--muted);white-space:nowrap}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:.95rem}
.btn:hover{border-color:var(--hue,var(--focus))}
.btn.pri{background:var(--hue,var(--h-home));border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{font-weight:400;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
@media (min-width:1200px){
  .sec{grid-template-columns:minmax(0,1fr) 350px;column-gap:34px}
  .facts{grid-column:2;grid-row:2;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - env(safe-area-inset-top,0px) - 32px);overflow:auto;padding-right:2px}
  .sec-body{grid-column:1;grid-row:2}
}
@media (max-width:560px){.sec-head{grid-template-columns:1fr}.sec-head .tile{width:72px}}

/* fact boxes */
.facts h2{font-size:1.05rem;margin:0 0 10px}
.facts .hint{font-size:.85rem;color:var(--muted);margin:0 0 10px}
details.fact{background:var(--factbg);border:1px solid var(--factline);border-radius:14px;margin-bottom:10px;overflow:hidden}
details.fact summary{cursor:pointer;padding:12px 14px;font:700 1rem/1.25 var(--fh);list-style:none;display:flex;gap:10px;align-items:center;justify-content:space-between}
details.fact summary::-webkit-details-marker{display:none}
details.fact summary::after{content:"+";font:700 1.3rem/1 var(--fh);flex:none}
details.fact[open] summary::after{content:"–"}
details.fact .fbody{padding:0 14px 14px;font-size:.95rem}
details.fact .fbody ul{margin:.3em 0 .6em;padding-left:1.2em}
details.fact .fbody li{margin:.15em 0}
details.fact.flash{animation:flash 1.4s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px color-mix(in srgb,var(--hue) 45%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
.ftab{width:100%;border-collapse:collapse;font-size:.9rem;margin:.4em 0 .7em}
.ftab th,.ftab td{border:1px solid var(--factline);padding:5px 8px;text-align:left;vertical-align:top}
.ftab th{background:color-mix(in srgb,var(--factline) 35%,transparent)}
.scroll-x{overflow-x:auto}
.formula{font-family:var(--fh);font-weight:700}

/* banner */
.banner{display:none;background:var(--factbg);border:2px solid var(--factline);border-radius:14px;padding:14px 16px;margin-bottom:18px;gap:14px;align-items:center;flex-wrap:wrap}
.banner.show{display:flex;animation:flash 1.6s ease}
.banner b{font-family:var(--fh)}
.banner p{margin:0;flex:1 1 320px}

/* labs */
.lab{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:22px}
.lab>h2{font-size:1.2rem;margin-bottom:4px}
.lab>.sub{color:var(--muted);font-size:.93rem;margin-bottom:14px}
.lab-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.lab-cols{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 11px;cursor:pointer;font-weight:700;min-height:36px}
.chip:hover{border-color:var(--hue)}
.chip[aria-pressed="true"]{background:var(--hue);color:#fff;border-color:var(--hue)}
.ptab{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:3px;max-width:520px}
.ptab button{aspect-ratio:1;border:0;border-radius:6px;padding:0;cursor:pointer;color:#fff;font:700 .78rem/1 var(--fh);min-width:0;position:relative}
.ptab button small{position:absolute;top:1px;left:2px;font-size:.5rem;font-weight:500;opacity:.85}
.ptab button[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px;z-index:1}
.ptab .m{background:#3E6FD1}.ptab .n{background:#2E8B67}.ptab .h{background:#8B6BC8}.ptab .e{background:#C0562E}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:8px 0 12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.info{width:100%;border-collapse:collapse;font-size:.95rem}
.info th{text-align:left;font-weight:400;color:var(--muted);padding:4px 10px 4px 0;white-space:nowrap}
.info td{padding:4px 0;font-weight:700}
.msg{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:.93rem}
.msg.good{background:var(--okbg);color:var(--ok)}
svg text{font-family:var(--fh)}
.svgbox{background:var(--soft);border-radius:14px;padding:6px}
.svgbox svg{width:100%;height:auto;display:block;max-height:340px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.big{font:800 2rem/1.1 var(--fh)}
.ion{display:inline-grid;place-items:center;min-width:48px;height:48px;border-radius:50%;font:700 .95rem var(--fh);color:#fff;padding:0 4px}
.ion.pos{background:#3E6FD1}.ion.neg{background:#C0562E}
.tester{display:grid;grid-template-columns:1fr;gap:10px}
.res{font-weight:700;padding:10px 12px;border-radius:10px}
.res.on{background:var(--okbg);color:var(--ok)}.res.off{background:var(--nobg);color:var(--no)}
.bulb .glass{fill:#8A97A8;transition:fill .2s}
.bulb.on .glass{fill:#FFD23F;filter:drop-shadow(0 0 10px #FFC400)}

/* ---------- questions ---------- */
.qs>h2{font-size:1.35rem;margin:6px 0 12px}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px 14px;margin-bottom:14px}
.q.ok{border-color:var(--ok)}.q.no{border-color:var(--no)}
.q-h{display:grid;grid-template-columns:34px 1fr;gap:12px;margin-bottom:10px}
.q-n{width:34px;height:34px;border-radius:9px;background:var(--hue);color:#fff;display:grid;place-items:center;font:800 .95rem var(--fh)}
.q-t{font-size:1.06rem;font-weight:700;padding-top:3px}
.q-t .tag{font-weight:400;font-size:.82rem;color:var(--muted);display:block}
.opts{display:grid;gap:7px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:9px 13px;cursor:pointer;line-height:1.35}
.opt:hover{border-color:var(--hue)}
.opt[aria-checked="true"]{border-color:var(--hue);background:color-mix(in srgb,var(--hue) 12%,var(--card))}
.opt.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}
.opt.no{border-color:var(--no);background:var(--nobg);color:var(--ink)}
.tfrow{display:flex;gap:8px}.tfrow .opt{flex:0 0 auto;min-width:110px;text-align:center;font-weight:700}
.inp{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0;width:min(100%,320px);background:var(--card)}
.inp.small{width:150px}
.inp.ok,.sel.ok{border-color:var(--ok);background:var(--okbg)}
.inp.no,.sel.no{border-color:var(--no);background:var(--nobg)}
.sel{border:1.5px solid var(--line);border-radius:10px;padding:7px 9px;background:var(--card);max-width:100%}
.cz{line-height:2.4;font-size:1.02rem}
.cz .sel,.cz .inp{margin:0 4px}
.rows{display:grid;gap:8px}
.rw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;align-items:center;padding:7px 10px;border-radius:12px;background:var(--soft);border:1.5px solid transparent}
.rw.ok{border-color:var(--ok);background:var(--okbg)}.rw.no{border-color:var(--no);background:var(--nobg)}
.rw .sel{width:100%}
@media (max-width:560px){.rw{grid-template-columns:1fr}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:5px 10px;cursor:pointer;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--hue);color:#fff;border-color:var(--hue)}
.rw.so{grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr)}
@media (max-width:560px){.rw.so{grid-template-columns:1fr}}
.ord{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.ord li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px 8px 14px;border-radius:12px;background:var(--soft);border:1.5px solid transparent}
.ord li.ok{border-color:var(--ok);background:var(--okbg)}.ord li.no{border-color:var(--no);background:var(--nobg)}
.ord .mv{display:flex;gap:4px}
.ord .mv button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:700}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pc{background:var(--soft);border-radius:12px;padding:8px;text-align:center;border:1.5px solid transparent}
.pc.ok{border-color:var(--ok);background:var(--okbg)}.pc.no{border-color:var(--no);background:var(--nobg)}
.pc svg{width:82px;height:82px}
.pc .sel{width:100%;margin-top:4px;font-size:.88rem}
.q-a{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.fb{margin-top:10px;font-size:.95rem}
.fb:empty{display:none}
.fb .v{padding:9px 12px;border-radius:10px}
.fb .v.ok{background:var(--okbg);color:var(--ink)}
.fb .v.no{background:var(--nobg)}
.fb .v.rv{background:var(--soft);border:1px dashed var(--muted)}
.fb .v b:first-child{color:inherit}
.fb .fchip{margin-top:8px;display:inline-flex;align-items:center;gap:6px;background:var(--factbg);border:1px solid var(--factline);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:700;font-size:.88rem}
.fb .fchip:hover{border-color:var(--ink)}

/* quiz + fasit */
.qsum{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qsum .big{font-size:1.5rem}
.fas details.fs{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
.fas details.fs>summary{cursor:pointer;padding:12px 16px;font:700 1.1rem var(--fh);display:flex;align-items:center;gap:12px}
.fas details.fs>summary .tile{width:38px;font-size:.6rem}
.fas details.fs>summary .tile .s{font-size:1rem}
.fas details.fs>summary .tile .z{display:none}
.fas ol{margin:0;padding:0 16px 14px;list-style:none;display:grid;gap:10px}
.fas li{display:grid;grid-template-columns:32px 1fr;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.fas li .n{font:800 .9rem var(--fh);color:var(--hue)}
.fas .a{margin-top:4px;background:var(--okbg);border-radius:9px;padding:6px 10px}
.fas .w{margin-top:4px;color:var(--muted);font-size:.93rem}
.fas .mini-p{display:inline-flex;align-items:center;gap:6px;margin:2px 10px 2px 0}
.fas .mini-p svg{width:38px;height:38px}
.kbd{font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<a class="skip" href="#main">Hopp til innhold</a>
<div class="topbar"><button id="menuBtn" aria-expanded="false" aria-controls="nav">Meny</button><b>Kjemiske bindinger</b></div>
<div class="app">
  <nav class="nav" id="nav" aria-label="Temaer"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<script>
/* =====================================================================
   DATA – alle temaer, faktabokser og oppgaver
   t: mc (flervalg) | tf (sant/usant) | in (skriv svar) | cz (fyll inn) |
      mt (kople sammen) | so (sorter) | or (rekkefølge) | pi (piktogram)
   ===================================================================== */
const SECTIONS = [

/* ------------------------------------------------------------------ 1 */
{ id:'atom', sym:'C', z:6, hue:'var(--h-atom)', num:'2.1',
  title:'Atomer, grunnstoffer og periodesystemet',
  goal:'Du skal kunne beskrive hvordan et atom er bygget opp, lese av periodesystemet og forstå kjemiske skrivemåter.',
  facts:[
   {id:'partikler', title:'Atomets tre partikler', html:`
     <div class="scroll-x"><table class="ftab"><tr><th>Partikkel</th><th>Ladning</th><th>Masse (u)</th><th>Hvor?</th></tr>
     <tr><td>Proton</td><td>+e</td><td>1</td><td>Atomkjernen</td></tr>
     <tr><td>Nøytron</td><td>0</td><td>1</td><td>Atomkjernen</td></tr>
     <tr><td>Elektron</td><td>−e</td><td>0,0005</td><td>Utenfor kjernen, i skall</td></tr></table></div>
     <ul><li>Et <b>nøytralt atom</b> har like mange protoner (+) som elektroner (−).</li>
     <li>u = atomære enheter. Elektronet veier nesten ingenting sammenlignet med protoner og nøytroner.</li></ul>`},
   {id:'grunnstoff', title:'Grunnstoff og periodesystemet', html:`
     <ul><li>Et <b>grunnstoff</b> består av én type atomer: alle atomene har like mange protoner i kjernen. Det finnes 118 forskjellige.</li>
     <li><b>Atomnummer = grunnstoffnummer = antall protoner.</b> Karbon (C) har 6 protoner, xenon (Xe) har 54.</li>
     <li>Symbolet har <b>stor forbokstav</b> og eventuelt én liten bokstav etter: <span class="formula">Mg</span>, ikke MG.</li>
     <li>Samme farge i periodesystemet = liknende kjemiske egenskaper.</li></ul>`},
   {id:'skall', title:'Skallmodellen, gruppe og periode', html:`
     <ul><li>Elektronene er fordelt i <b>skall</b>. Hvert skall er et energinivå.</li>
     <li>Fyllingsrekkefølge for de lette grunnstoffene: <b>2, 8, 8</b> …  I ytterste skall er det aldri mer enn 8.</li>
     <li><b>Valenselektroner</b> = elektronene i ytterste skall.</li>
     <li><b>Gruppe</b> (kolonne, nedover) = antall valenselektroner. Eks: klor står i gruppe 17 (7) og har 7 valenselektroner.</li>
     <li><b>Periode</b> (rad, bortover) = antall elektronskall. Eks: svovel står i periode 3 og har 3 skall.</li>
     <li>Skallmodellen er en <b>modell</b> som forklarer hvordan ting henger sammen. Elektronskyen viser mer eksakt hvor elektronene er, men er også en modell.</li></ul>`},
   {id:'skriv', title:'Skrivemåter i kjemi', html:`
     <ul><li><b>Cl₂</b> = ett molekyl der to kloratomer er bundet sammen.</li>
     <li><b>2Cl</b> = to separate kloratomer. Tallet <em>foran</em> sier hvor mange partikler det er.</li>
     <li>Tallet <em>nedsenket</em> etter symbolet sier hvor mange atomer av det slaget som er i molekylet: CO₂ = 1 C og 2 O.</li>
     <li><b>2CO₂</b> = to molekyler CO₂ = 2 C og 4 O til sammen.</li>
     <li>Tilstandssymboler: <b>(s)</b> fast, <b>(l)</b> væske, <b>(g)</b> gass, <b>(aq)</b> oppløst i vann.</li></ul>`}
  ],
  lab:['atom'],
  qs:[
   {t:'mc',q:'Hvilken partikkel har negativ ladning?',o:['Elektron','Proton','Nøytron','Atomkjerne'],a:0,why:'Elektronet har ladning −e. Protonet er positivt, og nøytronet har ingen ladning.',f:'partikler'},
   {t:'mc',q:'Hvilke to partikler finner vi i atomkjernen?',o:['Protoner og nøytroner','Protoner og elektroner','Nøytroner og elektroner','Bare protoner'],a:0,why:'Kjernen består av protoner og nøytroner. Elektronene beveger seg utenfor kjernen.',f:'partikler'},
   {t:'mc',q:'Hvilken partikkel har nesten ingen masse (0,0005 u)?',o:['Elektron','Proton','Nøytron','Alle veier like mye'],a:0,why:'Protoner og nøytroner veier 1 u hver, elektronet bare 0,0005 u.',f:'partikler'},
   {t:'tf',q:'Et nøytralt atom har like mange protoner som elektroner.',a:true,why:'De positive og negative ladningene utligner hverandre, så atomet blir nøytralt.',f:'partikler'},
   {t:'mc',q:'Et grunnstoff består av …',o:['én type atomer (like mange protoner)','flere typer atomer med ulikt antall protoner','bare molekyler','bare ioner'],a:0,why:'Alle atomene i et grunnstoff har samme antall protoner.',f:'grunnstoff'},
   {t:'in',q:'Hvilket grunnstoff har 6 protoner i kjernen? (Bruk periodesystemet.)',a:['karbon','C'],show:'Karbon (C)',why:'Antall protoner = atomnummer. Atomnummer 6 er karbon.',f:'grunnstoff'},
   {t:'in',q:'Hvor mange protoner har xenon (Xe) i kjernen?',a:['54'],show:'54',why:'Xenon har atomnummer 54, altså 54 protoner.',f:'grunnstoff'},

   {t:'mc',q:'Hvilken skrivemåte er riktig for symbolet til magnesium?',o:['Mg','MG','mg','mG'],a:0,why:'Stor forbokstav og eventuelt en liten bokstav etter.',f:'grunnstoff'},
   {t:'in',q:'Hvor mange valenselektroner har klor (Cl)?',a:['7'],show:'7',why:'Klor står i gruppe 17 (7), så det har 7 valenselektroner. Se det i atombyggeren over.',f:'skall'},
   {t:'in',q:'Hvor mange elektronskall har svovel (S)?',a:['3'],show:'3',why:'Svovel står i periode 3, og antall skall = periodenummer.',f:'skall'},
   {t:'mc',q:'Hvilket par av grunnstoffer har liknende kjemiske egenskaper?',o:['Natrium (Na) og kalium (K)','Natrium (Na) og magnesium (Mg)','Natrium (Na) og klor (Cl)','Natrium (Na) og neon (Ne)'],a:0,why:'Na og K står i samme gruppe (gruppe 1) og har begge 1 valenselektron.',f:'skall'},
   {t:'cz',q:'I periodesystemet forteller gruppen (kolonnen) hvor mange {0} atomet har i ytterste skall. Perioden (raden) forteller hvor mange {1} atomet har.',b:[{o:['protoner','valenselektroner','nøytroner'],a:1},{o:['elektronskall','valenselektroner','ioner'],a:0}],why:'Gruppe → valenselektroner. Periode → elektronskall.',f:'skall'},
   {t:'tf',q:'I ytterste skall er det aldri mer enn 8 elektroner.',a:true,why:'Ytterste skall rommer maksimalt 8 elektroner (oktett).',f:'skall'},
   {t:'tf',q:'Skallmodellen viser nøyaktig hvor elektronene befinner seg.',a:false,why:'Skallmodellen er en forenklet modell. Elektronskyen er mer eksakt, men også en modell.',f:'skall'},
   {t:'mt',q:'Kople tilstandssymbolet med riktig betydning.',l:[['(s)','fast stoff'],['(l)','væske'],['(g)','gass'],['(aq)','oppløst i vann']],why:'s = solid, l = liquid, g = gas, aq = aquatic (vandig løsning).',f:'skriv'},
   {t:'mc',q:'Hva er forskjellen på 2Cl og Cl₂?',o:['2Cl er to separate kloratomer, Cl₂ er to kloratomer bundet sammen til ett molekyl','Ingen forskjell – det er to måter å skrive det samme på','2Cl er ett molekyl, Cl₂ er to separate atomer','Cl₂ har dobbelt så mange protoner som 2Cl'],a:0,why:'Tallet foran = antall separate partikler. Tallet nedsenket = antall atomer bundet sammen i molekylet.',f:'skriv'},

{ id:'okt', sym:'Ne', z:10, hue:'var(--h-okt)', num:'2.2',
  title:'Kjemiske bindinger og oktettregelen',
  goal:'Du skal forklare hvorfor atomer binder seg, hva et ion er, og kjenne de tre typene sterke bindinger.',
  facts:[
   {id:'hvorfor', title:'Hvorfor binder atomer seg?', html:`
     <ul><li>Bare <b>edelgassene</b> finnes som enkeltatomer i naturen. De har full ytterste skall og er «fornøyde».</li>
     <li>Alle andre atomer er <b>bundet sammen</b> for å få full ytterste skall.</li>
     <li>Tre typer <b>sterke bindinger</b> mellom atomer:
       <ul><li><b>Ionebinding</b>: metall + ikke-metall</li><li><b>Kovalent binding</b>: ikke-metall + ikke-metall</li><li><b>Metallbinding</b>: metall + metall</li></ul></li></ul>`},
   {id:'oktett', title:'Oktettregelen', html:`
     <p>«Atomer vil ha <b>8 elektroner i ytterste skall</b>.» (Hydrogen og helium klarer seg med 2 i første skall.)</p>
     <ul><li><b>Natrium</b> (gruppe 1): 1 valenselektron. Gir det lett fra seg → 8 elektroner i skallet under.</li>
     <li><b>Klor</b> (gruppe 17 (7)): 7 valenselektroner. Tar lett opp 1 elektron → 8 i ytterste skall.</li></ul>
     <p>Metaller har få valenselektroner og gir dem fra seg. Ikke-metaller har mange og tar opp elektroner.</p>`},
   {id:'ioner', title:'Ioner og ladning', html:`
     <ul><li>Et <b>ion</b> er et ladd atom: det har tatt opp eller gitt fra seg elektroner.</li>
     <li>Tatt opp elektroner → <b>negativt</b> ion. Gitt fra seg elektroner → <b>positivt</b> ion. (Elektroner er negative!)</li>
     <li>Antall <b>protoner endres aldri</b>. Bare elektronene.</li></ul>
     <div class="scroll-x"><table class="ftab"><tr><th>Gruppe</th><th>Typisk ion</th></tr>
     <tr><td>1</td><td>+1 (Na⁺)</td></tr><tr><td>2</td><td>+2 (Mg²⁺)</td></tr><tr><td>13 (3)</td><td>+3 (Al³⁺)</td></tr>
     <tr><td>15 (5)</td><td>−3 (N³⁻)</td></tr><tr><td>16 (6)</td><td>−2 (O²⁻)</td></tr><tr><td>17 (7)</td><td>−1 (Cl⁻)</td></tr></table></div>`},
   {id:'hvilken', title:'Hvilken binding får jeg?', html:`
     <div class="scroll-x"><table class="ftab"><tr><th>Atomene</th><th>Binding</th></tr>
     <tr><td>Metall + ikke-metall</td><td>Ionebinding</td></tr>
     <tr><td>Ikke-metall + ikke-metall</td><td>Kovalent binding</td></tr>
     <tr><td>Metall + metall</td><td>Metallbinding</td></tr></table></div>
     <p>Metaller står til venstre og i midten av periodesystemet, ikke-metaller oppe til høyre. Edelgassene (gruppe 18) binder seg vanligvis ikke.</p>`}
  ],
  lab:['ion'],
  qs:[
   {t:'mc',q:'Hvorfor finnes bare edelgassene som enkeltatomer i naturen?',o:['De har full ytterste skall og trenger ikke binde seg','De har ingen elektroner','De er tyngre enn andre atomer','De har ingen protoner i kjernen'],a:0,why:'Full ytterste skall gjør atomet stabilt.',f:'hvorfor'},
   {t:'mc',q:'Hva sier oktettregelen?',o:['Atomer vil ha 8 elektroner i ytterste skall','Atomer vil ha 8 protoner i kjernen','Alle atomer har 8 nøytroner','Atomer kan ha maksimalt 8 skall'],a:0,why:'Oktett = åtte. Atomene binder seg for å få åtte elektroner i ytterste skall.',f:'oktett'},
   {t:'mc',q:'Hvilke tre typer sterke bindinger finnes mellom atomer?',o:['Ionebinding, kovalent binding og metallbinding','Ionebinding, hydrogenbinding og metallbinding','Kovalent binding, dipolbinding og hydrogenbinding','Metallbinding, dipolbinding og ionebinding'],a:0,why:'Hydrogenbinding og dipolbinding er svake bindinger mellom molekyler.',f:'hvorfor'},
   {t:'cz',q:'Et atom som tar opp elektroner blir {0} ladd. Et atom som gir fra seg elektroner blir {1} ladd.',b:[{o:['positivt','negativt','ikke'],a:1},{o:['negativt','positivt','ikke'],a:1}],why:'Elektroner er negative. Flere elektroner → negativt. Færre elektroner → positivt.',f:'ioner'},
   {t:'mc',q:'Natrium (gruppe 1) har 1 valenselektron. Hva blir natrium til som ion?',o:['Na⁺','Na⁻','Na²⁺','Na²⁻'],a:0,why:'Natrium gir fra seg 1 elektron og blir Na⁺.',f:'oktett'},
   {t:'mc',q:'Klor (gruppe 17 (7)) har 7 valenselektroner. Hva blir klor til som ion?',o:['Cl⁻','Cl⁺','Cl²⁻','Cl⁷⁻'],a:0,why:'Klor tar opp 1 elektron og får 8 i ytterste skall: Cl⁻ (klorid).',f:'oktett'},
   {t:'in',cs:true,q:'Hvilken ladning får et magnesiumion (Mg, gruppe 2)? Skriv for eksempel 3+ eller 2−.',a:['2+','+2','Mg2+'],show:'2+ (Mg²⁺)',why:'Magnesium har 2 valenselektroner og gir dem fra seg: Mg²⁺.',f:'ioner',ph:'f.eks. 3+'},
   {t:'in',cs:true,q:'Hvilken ladning får et oksidion (O, gruppe 16 (6))? Skriv for eksempel 3+ eller 2−.',a:['2-','-2','O2-'],show:'2− (O²⁻)',why:'Oksygen har 6 valenselektroner og tar opp 2 for å få 8: O²⁻.',f:'ioner',ph:'f.eks. 3+'},
   {t:'mc',q:'Hvor mange elektroner har et Na⁺-ion? (Natrium har atomnummer 11.)',o:['10','11','12','1'],a:0,why:'Nøytralt natrium har 11 elektroner. Na⁺ har gitt fra seg ett: 10 elektroner (2, 8).',f:'ioner'},
   {t:'tf',q:'Ioner med lik ladning tiltrekker hverandre.',a:false,why:'Motsatt ladning tiltrekker hverandre. Lik ladning frastøter.',f:'ioner'},
   {t:'tf',q:'Et natriumion (Na⁺) har like mange protoner som et natriumatom.',a:true,why:'Protonene endres aldri – det er bare elektronene som tas opp eller gis fra seg.',f:'ioner'},
   {t:'mc',q:'Hvorfor danner metaller (få valenselektroner) helst positive ioner?',o:['Det er lettere å gi fra seg noen få elektroner enn å ta opp mange','Metaller har flere protoner enn elektroner fra før','Elektroner er positive hos metaller','Metaller har ingen elektroner'],a:0,why:'Å gi fra seg 1–3 elektroner gir et fullt skall under. Å ta opp 5–7 hadde krevd mye mer.',f:'oktett'},
   {t:'so',q:'Sorter grunnstoffene: metall, ikke-metall eller edelgass?',cats:['Metall','Ikke-metall','Edelgass'],it:[['Na',0],['Cl',1],['Mg',0],['O',1],['Ne',2],['K',0],['S',1],['Ar',2],['Ca',0],['N',1]],why:'Bruk periodesystemet: metaller til venstre/midten, ikke-metaller oppe til høyre, edelgasser i gruppe 18.',f:'hvilken'},
   {t:'mt',q:'Hvilken type binding får du mellom disse atomene?',l:[['Na og Cl','Ionebinding'],['C og O','Kovalent binding'],['Fe og Fe','Metallbinding'],['Mg og O','Ionebinding'],['H og O','Kovalent binding'],['Cu og Zn','Metallbinding']],why:'Metall + ikke-metall = ion. Ikke-metall + ikke-metall = kovalent. Metall + metall = metallbinding.',f:'hvilken'}
  ]},

{ id:'ion', sym:'Na', z:11, hue:'var(--h-ion)', num:'2.3',
  title:'Ionebindinger og salter',
  goal:'Du skal forklare ionebinding, kjenne egenskapene til salter og kunne navn og formler på salter.',
  facts:[
   {id:'ionebinding', title:'Ionebinding og gitter', html:`
     <ul><li>Ionebinding skyldes at <b>positive og negative ioner tiltrekker hverandre</b>.</li>
     <li>Dannes mellom <b>metall og ikke-metall</b>. Det er en <b>sterk</b> binding.</li>
     <li>Ionene ordner seg i et regelmessig <b>gitter</b> (krystall).</li>
     <li>Et <b>salt</b> er et stoff bygget opp av ioner. Summen av ladningene i et salt er alltid <b>0</b>.</li></ul>`},
   {id:'saltegenskaper', title:'Egenskaper til salter', html:`
     <ul><li><b>Høye smelte- og kokepunkter</b>: ionebindingene er sterke, og det kreves mye energi for å bryte dem.</li>
     <li><b>Leder ikke strøm i fast form</b>: ionene sitter fast i gitteret. <b>Leder strøm</b> når saltet er smeltet eller oppløst i vann, fordi ionene da kan bevege seg fritt.</li>
     <li><b>Sprø</b>: hvis lagene forskyves, kommer like ladninger mot hverandre. De frastøter, og krystallen brister.</li>
     <li>Ofte gjennomsiktige eller gjennomskinnelige. Ingen metallglans.</li></ul>`},
   {id:'saltnavn', title:'Navn på salter', html:`
     <ul><li><b>Metallet</b> (positivt) settes først, med vanlig navn.</li>
     <li><b>Ikke-metallet</b> (negativt) kommer sist, med forkortet stamme + endelsen <b>–id</b>.</li></ul>
     <div class="scroll-x"><table class="ftab"><tr><th>Ikke-metall</th><th>Ion-navn</th></tr>
     <tr><td>klor</td><td>klorid</td></tr><tr><td>fluor</td><td>fluorid</td></tr><tr><td>oksygen</td><td>oksid</td></tr>
     <tr><td>svovel</td><td>sulfid</td></tr><tr><td>nitrogen</td><td>nitrid</td></tr></table></div>
     <p>Eksempel: Na + Cl → <b>natriumklorid</b> (NaCl).</p>`},
   {id:'saltformel', title:'Formelen til salter', html:`
     <p>Husk ladningene. Formelen skal alltid gi <b>sum ladning = 0</b>.</p>
     <ul><li>Gruppe 1: +1 · Gruppe 2: +2 · Gruppe 13 (3): +3</li><li>Gruppe 17 (7): −1 · Gruppe 16 (6): −2 · Gruppe 15 (5): −3</li></ul>
     <p><b>Kryssregelen:</b> ladningstallet til det ene ionet blir antallet av det andre.</p>
     <ul><li>Mg²⁺ + Cl⁻ → 1 Mg og 2 Cl → <b>MgCl₂</b></li>
     <li>Al³⁺ + O²⁻ → 2 Al og 3 O → <b>Al₂O₃</b> (2·3 = 6 og 3·2 = 6)</li></ul>`}
  ],
  lab:['led','salt'],
  qs:[
   {t:'mc',q:'Hva skyldes en ionebinding?',o:['Tiltrekning mellom positive og negative ioner','At atomer deler elektronpar','Tiltrekning mellom en elektronsjø og positive ioner','At molekyler tiltrekker hverandre'],a:0,why:'Motsatt ladde ioner tiltrekker hverandre.',f:'ionebinding'},
   {t:'mc',q:'Mellom hvilke typer atomer dannes ionebinding?',o:['Metall og ikke-metall','Ikke-metall og ikke-metall','Metall og metall','Edelgass og edelgass'],a:0,why:'Metallet gir fra seg elektroner, ikke-metallet tar dem opp.',f:'ionebinding'},
   {t:'mc',q:'Ionene i NaCl ordner seg i en regelmessig struktur. Hva kalles den?',o:['Gitterstruktur (krystall)','Elektronsjø','Molekyl','Legering'],a:0,why:'Salter danner krystaller med ionene i et gitter.',f:'ionebinding'},
   {t:'tf',q:'Summen av ladningene i et salt er alltid 0.',a:true,why:'Saltet er nøytralt utad: de positive og negative ladningene utligner hverandre.',f:'ionebinding'},
   {t:'mt',q:'Hvilken ladning får ionene fra disse gruppene?',l:[['Gruppe 1 (f.eks. Na)','+1'],['Gruppe 2 (f.eks. Mg)','+2'],['Gruppe 17 (7) (f.eks. Cl)','−1'],['Gruppe 16 (6) (f.eks. O)','−2']],why:'Metaller blir positive ioner, ikke-metaller negative. Antall valenselektroner avgjør ladningen.',f:'saltformel'},
   {t:'so',q:'Salt eller metall? Sorter egenskapene.',cats:['Salt','Metall'],it:[['Sprø',0],['Formbar',1],['Leder strøm i fast form',1],['Leder ikke strøm i fast form',0],['Har metallglans',1],['Leder strøm oppløst i vann',0],['Leder varme godt',1],['Ofte gjennomsiktig',0]],why:'Se faktaboksene om salter og metaller.',f:'saltegenskaper'},
   {t:'mc',q:'Hvorfor har salter høye smelte- og kokepunkter?',o:['Ionebindingene er sterke, så det kreves mye energi å bryte dem','Saltene består av veldig tunge atomer','Saltene inneholder mye vann','Ionene er nøytrale og trekker ikke på hverandre'],a:0,why:'Sterke bindinger → mye energi må til for å smelte og koke.',f:'saltegenskaper'},

   {t:'cz',q:'Når vi navngir et salt, settes {0} først, og ikke-metallet får endelsen {1}.',b:[{o:['ikke-metallet','metallet','edelgassen'],a:1},{o:['–an','–ol','–id'],a:2}],why:'Na + Cl → natriumklorid: metallet først, ikke-metallet med –id sist.',f:'saltnavn'},

   {t:'in',q:'Hva er navnet på Na₂S?',a:['natriumsulfid'],show:'natriumsulfid',why:'Na = natrium, S = svovel → sulfid.',f:'saltnavn',ph:'skriv navnet'},
   {t:'in',cs:true,q:'Skriv formelen til natriumklorid.',a:['NaCl'],show:'NaCl',why:'Na⁺ og Cl⁻ har ladning +1 og −1. Ett av hver gir sum 0.',f:'saltformel',ph:'skriv formelen'},

/* ------------------------------------------------------------------ 4 */
{ id:'kov', sym:'Cl', z:17, hue:'var(--h-kov)', num:'2.4',
  title:'Kovalente bindinger',
  goal:'Du skal forklare kovalent binding, polar binding og dipol, og de svake bindingene mellom molekyler.',
  facts:[
   {id:'kovalent', title:'Kovalent binding', html:`
     <ul><li>Atomene <b>deler elektroner</b> for å oppfylle oktettregelen. Kalles også <b>elektronparbinding</b>.</li>
     <li>Dannes mellom <b>ikke-metall og ikke-metall</b>.</li>
     <li><b>Enkeltbinding</b>: ett delt elektronpar (Cl₂).<br><b>Dobbeltbinding</b>: to elektronpar (O₂).<br><b>Trippelbinding</b>: tre elektronpar (N₂).</li>
     <li>Antall bindinger et atom trenger = 8 − antall valenselektroner. H og halogener (F, Cl): 1. O: 2. N: 3. C: 4.</li>
     <li>Kovalente forbindelser har ofte <b>lavere smelte- og kokepunkt</b> enn salter.</li></ul>`},
   {id:'polar', title:'Polar binding og dipol', html:`
     <ul><li>I en <b>polar kovalent binding</b> er elektronparet <b>skjevt fordelt</b>. Det krever <b>ulike atomer</b>.</li>
     <li>Eks. HCl: klor trekker mer på elektronene. Cl får litt negativ ladning (δ−), H litt positiv (δ+).</li>
     <li>Et molekyl med en positiv og en negativ side er en <b>dipol</b>. Det avhenger av <b>strukturen</b>: CO₂ har polare bindinger, men er rett og symmetrisk, så trekkene utligner hverandre og molekylet er ingen dipol.</li></ul>`},
   {id:'svake', title:'Svake bindinger mellom molekyler', html:`
     <ul><li><b>Dipolbinding</b>: elektrostatisk tiltrekning (+ og −) mellom dipoler.</li>
     <li><b>Hydrogenbinding</b>: spesielt sterk dipolbinding når hydrogen er bundet til <b>O, F eller N</b> – de trekker hardt på elektronene.</li>
     <li>Hydrogenbindinger forklarer vannets egenskaper: <b>høyt smelte- og kokepunkt</b>, <b>overflatespenning</b> og at vann er et <b>godt løsemiddel</b>.</li>
     <li>Vann løser salt: de polare vannmolekylene trekker på Na⁺ og Cl⁻ og løsner dem fra gitteret.</li></ul>`},
   {id:'sterkesvake', title:'Sterke og svake bindinger', html:`
     <div class="scroll-x"><table class="ftab"><tr><th>Sterke (mellom atomer)</th><th>Svake (mellom molekyler)</th></tr>
     <tr><td>Ionebinding<br>Kovalent binding<br>Metallbinding</td><td>Dipolbinding<br>Hydrogenbinding</td></tr></table></div>
     <p>Når vann koker, brytes <b>de svake hydrogenbindingene mellom molekylene</b>. De kovalente bindingene inne i hvert H₂O-molekyl holder.</p>`}
  ],
  lab:['mol'],
  qs:[
   {t:'mc',q:'Hva skjer i en kovalent binding?',o:['Atomene deler elektroner','Et atom gir elektroner til et annet','Positive ioner trekker på en elektronsjø','Molekyler tiltrekker hverandre'],a:0,why:'Kovalent binding = elektronparbinding: atomene deler.',f:'kovalent'},
   {t:'mc',q:'Mellom hvilke typer atomer får vi kovalent binding?',o:['Ikke-metall og ikke-metall','Metall og ikke-metall','Metall og metall','Bare edelgasser'],a:0,why:'Ikke-metaller har mange valenselektroner og deler i stedet for å gi fra seg.',f:'kovalent'},
   {t:'mt',q:'Hvilken type kovalent binding har disse molekylene?',l:[['Cl₂','Enkeltbinding (1 elektronpar)'],['O₂','Dobbeltbinding (2 elektronpar)'],['N₂','Trippelbinding (3 elektronpar)']],why:'Cl har 7 valenselektroner (trenger 1), O har 6 (trenger 2), N har 5 (trenger 3).',f:'kovalent'},
   {t:'in',q:'Hvor mange elektronpar deler de to nitrogenatomene i N₂?',a:['3'],show:'3',why:'Nitrogen har 5 valenselektroner og trenger 3 til: trippelbinding.',f:'kovalent'},
   {t:'in',q:'Hvor mange enkeltbindinger danner ett oksygenatom (6 valenselektroner) i H₂O?',a:['2'],show:'2',why:'Oksygen trenger 2 elektroner for å få 8, så det danner to bindinger (en til hvert H).',f:'kovalent'},
   {t:'tf',q:'Kovalente forbindelser har ofte lavere smelte- og kokepunkt enn salter.',a:true,why:'Bindingene mellom molekylene er svake, så det kreves mindre energi å skille dem.',f:'kovalent'},
   {t:'mc',q:'Hvorfor er bindingen i HCl polar?',o:['Klor trekker sterkere på elektronparet enn hydrogen','Hydrogen trekker sterkere på elektronparet enn klor','Begge atomene er like','Bindingen består av ioner'],a:0,why:'Kloratomet trekker mer på elektronene, så Cl blir δ− og H blir δ+.',f:'polar'},
   {t:'so',q:'Er bindingen upolar eller polar?',cats:['Upolar (like atomer)','Polar (ulike atomer)'],it:[['Cl₂',0],['HCl',1],['O₂',0],['H₂O',1],['N₂',0],['HF',1]],why:'Like atomer trekker like hardt → upolar. Ulike atomer → skjev fordeling → polar.',f:'polar'},
   {t:'tf',q:'En polar kovalent binding kan bare oppstå mellom forskjellige atomer.',a:true,why:'Er atomene like, trekker de like hardt på elektronene og bindingen er upolar.',f:'polar'},
   {t:'mc',q:'Hva er en dipol?',o:['Et molekyl med en positiv og en negativ side','Et molekyl med to like atomer','Et atom som har tatt opp to elektroner','To ioner som er bundet sammen'],a:0,why:'Dipol = to poler, én positiv og én negativ.',f:'polar'},
   {t:'cz',q:'Polare kovalente bindinger kan lage {0}, som har en positiv og en negativ side. Binding mellom slike molekyler kalles {1}.',b:[{o:['legeringer','ioner','dipoler'],a:2},{o:['ionebinding','dipolbinding','trippelbinding'],a:1}],why:'Dipoler tiltrekker hverandre med dipolbindinger.',f:'svake'},
   {t:'mc',q:'Utfordring: CO₂ har to polare bindinger (C=O), men molekylet er ingen dipol. Hvorfor?',o:['Molekylet er rett og symmetrisk, så trekkene utligner hverandre','Karbon og oksygen er like atomer','Bindingene er ionebindinger','CO₂ har ingen elektroner'],a:0,why:'Strukturen avgjør. O=C=O er lineær, så de to trekkene går i hver sin retning og kansellerer.',f:'polar'},
   {t:'mc',q:'Når oppstår hydrogenbinding?',o:['Når hydrogen er bundet til oksygen, fluor eller nitrogen','Når hydrogen er bundet til et annet hydrogen','Når hydrogen er bundet til et metall','Når to ioner møtes'],a:0,why:'O, F og N trekker mye på elektronene og gjør hydrogen tydelig positivt.',f:'svake'},
   {t:'mc',q:'Hva forklarer at vann har uvanlig høyt smelte- og kokepunkt?',o:['Hydrogenbindinger mellom vannmolekylene','Ionebindinger mellom H og O','Metallbinding i vann','At vann er en gass'],a:0,why:'Hydrogenbindingene må brytes for at vann skal smelte eller koke.',f:'svake'},
   {t:'mc',q:'Hva brytes når vann koker?',o:['De svake hydrogenbindingene mellom vannmolekylene','De kovalente bindingene mellom H og O i hvert molekyl','Både atomkjernene og elektronskallene','Ionebindingene i vann'],a:0,why:'Vanndamp er fortsatt H₂O. Molekylene holder sammen, men slipper hverandre.',f:'sterkesvake'},
   {t:'so',q:'Sterk eller svak binding?',cats:['Sterk (mellom atomer)','Svak (mellom molekyler)'],it:[['Ionebinding',0],['Kovalent binding',0],['Metallbinding',0],['Dipolbinding',1],['Hydrogenbinding',1]],why:'Sterke bindinger holder atomer sammen. Svake bindinger virker mellom hele molekyler.',f:'sterkesvake'},
   {t:'mc',q:'Hvorfor er vann et godt løsemiddel for salter som NaCl?',o:['De polare vannmolekylene trekker på ionene og løsner dem fra gitteret','Vann er en kald væske','Vann danner kovalente bindinger med saltet','Vann er upolart'],a:0,why:'Na⁺ tiltrekkes av O-siden (δ−), Cl⁻ av H-siden (δ+).',f:'svake'},
   {t:'mc',q:'Overflatespenning i vann skyldes …',o:['hydrogenbindinger som holder vannmolekylene sammen i overflaten','at vann er varmt','ionebindinger i vannet','at vann er en gass'],a:0,why:'Molekylene i overflaten trekkes mot hverandre og danner en «hinne».',f:'svake'}
  ]},

/* ------------------------------------------------------------------ 5 */
{ id:'navn', sym:'N', z:7, hue:'var(--h-navn)', num:'2.4',
  title:'Navn på molekylforbindelser',
  goal:'Du skal kunne tallordene (s. 58) og gi navn til, og skrive formler for, enkle molekylforbindelser.',
  facts:[
   {id:'regler', title:'Reglene for navnsetting', html:`
     <ul><li>Det <b>første</b> grunnstoffet får sitt vanlige norske navn.</li>
     <li>Det <b>siste</b> får en forkortet stamme + endelsen <b>–id</b>.</li>
     <li><b>Antallet</b> av hvert atom står som tallord <b>foran</b> navnet.</li>
     <li>«mono» utelates foran det første grunnstoffet (CO = <em>karbon</em>monoksid, ikke <em>mono</em>karbonmonoksid).</li>
     <li>HCl er hydrogenklorid.</li></ul>
     <div class="scroll-x"><table class="ftab"><tr><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>mono</td><td>di</td><td>tri</td><td>tetra</td><td>penta</td></tr>
     <tr><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th></tr><tr><td>heksa</td><td>hepta</td><td>okta</td><td>nona</td><td>deka</td></tr></table></div>`},
   {id:'stamme', title:'Endelser og eksempler', html:`
     <ul><li>oksygen → <b>oksid</b> · klor → <b>klorid</b> · svovel → <b>sulfid</b> · fluor → <b>fluorid</b> · nitrogen → <b>nitrid</b></li>
     <li>mono + oksid skrives <b>monoksid</b>.</li></ul>
     <div class="scroll-x"><table class="ftab"><tr><th>Formel</th><th>Navn</th></tr>
     <tr><td>CO₂</td><td>karbondioksid</td></tr><tr><td>CO</td><td>karbonmonoksid</td></tr>
     <tr><td>NO</td><td>nitrogenmonoksid</td></tr><tr><td>N₂O₃</td><td>dinitrogentrioksid</td></tr>
     <tr><td>H₂O</td><td>dihydrogenoksid</td></tr><tr><td>HCl</td><td>hydrogenklorid</td></tr></table></div>
     <p>Bygg N₂O₃: <b>di</b> + nitrogen + <b>tri</b> + oksid = dinitrogentrioksid.</p>`}
  ],
  lab:['navn'],
  qs:[
   {t:'mt',q:'Kople tallordene med riktig tall (del 1).',l:[['mono','1'],['di','2'],['tri','3'],['tetra','4'],['penta','5']],why:'Lær tallordene: mono, di, tri, tetra, penta, heksa, hepta, okta, nona, deka.',f:'regler'},
   {t:'mt',q:'Kople tallordene med riktig tall (del 2).',l:[['heksa','6'],['hepta','7'],['okta','8'],['nona','9'],['deka','10']],why:'Tallordene fra 6 til 10: heksa, hepta, okta, nona, deka.',f:'regler'},
   {t:'in',q:'Hva heter CO₂?',a:['karbondioksid'],show:'karbondioksid',why:'Ett C (mono utelates), to O → di + oksid.',f:'stamme',ph:'skriv navnet'},
   {t:'in',q:'Hva heter CO?',a:['karbonmonoksid'],show:'karbonmonoksid',why:'Ett C, ett O → karbon + mono + oksid = karbonmonoksid.',f:'stamme',ph:'skriv navnet'},
   {t:'in',q:'Hva heter NO?',a:['nitrogenmonoksid'],show:'nitrogenmonoksid',why:'Ett N og ett O → nitrogenmonoksid.',f:'stamme',ph:'skriv navnet'},
   {t:'in',q:'Hva heter N₂O₃?',a:['dinitrogentrioksid'],show:'dinitrogentrioksid',why:'To N (di), tre O (tri).',f:'stamme',ph:'skriv navnet'},
   {t:'in',q:'Hva heter SO₂?',a:['svoveldioksid'],show:'svoveldioksid',why:'Ett S (mono utelates), to O → svoveldioksid.',f:'stamme',ph:'skriv navnet'},
   {t:'in',q:'Hva heter SO₃?',a:['svoveltrioksid'],show:'svoveltrioksid',why:'Ett S, tre O → svovel + tri + oksid.',f:'stamme',ph:'skriv navnet'},
   {t:'in',q:'Hva heter PCl₃?',a:['fosfortriklorid'],show:'fosfortriklorid',why:'Ett P, tre Cl → fosfor + tri + klorid.',f:'stamme',ph:'skriv navnet'},
   {t:'in',q:'Hva heter CCl₄?',a:['karbontetraklorid'],show:'karbontetraklorid',why:'Ett C, fire Cl → karbon + tetra + klorid.',f:'stamme',ph:'skriv navnet'},
   {t:'in',q:'Hva heter HCl?',a:['hydrogenklorid'],show:'hydrogenklorid',why:'Hydrogen + klorid. Ingen tallord når det bare er ett av hver.',f:'regler',ph:'skriv navnet'},
   {t:'in',cs:true,q:'Skriv formelen til dihydrogenoksid.',a:['H2O'],show:'H₂O',why:'di = 2 hydrogen, oksid = ett oksygen. Dette er vann.',f:'stamme',ph:'skriv formelen'},
   {t:'in',cs:true,q:'Skriv formelen til nitrogendioksid.',a:['NO2'],show:'NO₂',why:'Ett N (mono utelates) og to O.',f:'stamme',ph:'skriv formelen'},
   {t:'in',cs:true,q:'Skriv formelen til dinitrogenmonoksid.',a:['N2O'],show:'N₂O',why:'di = 2 N, mono = 1 O.',f:'stamme',ph:'skriv formelen'},
   {t:'mc',q:'Hvilken formel har dinitrogentrioksid?',o:['N₂O₃','N₃O₂','NO₃','N₂O₂'],a:0,why:'di = 2 nitrogen, tri = 3 oksygen.',f:'stamme'},
   {t:'or',q:'Sett sammen navnet på N₂O₃ i riktig rekkefølge.',items:['di','nitrogen','tri','oksid'],why:'Tallord + første grunnstoff + tallord + stamme med –id: di·nitrogen·tri·oksid.',f:'regler'},
   {t:'mc',q:'Hva er riktig navn på CO?',o:['karbonmonoksid','monokarbonmonoksid','karbonoksid','monokarbonoksid'],a:0,why:'«mono» utelates foran det første grunnstoffet, men beholdes foran oksid.',f:'regler'},
   {t:'tf',q:'Det siste grunnstoffet i en molekylforbindelse får endelsen –id.',a:true,why:'Eks: oksygen → oksid, klor → klorid.',f:'regler'},
   {t:'tf',q:'Tallordet står etter navnet på atomet.',a:false,why:'Tallordet kommer foran navnet på atomet det gjelder.',f:'regler'}
  ]},

/* ------------------------------------------------------------------ 6 */
{ id:'met', sym:'Fe', z:26, hue:'var(--h-met)', num:'2.5',
  title:'Metallbindinger',
  goal:'Du skal forklare metallbinding og elektronsjø, egenskapene til metaller, legeringer og hvordan metaller fremstilles.',
  facts:[
   {id:'metallbinding', title:'Metallbinding og elektronsjø', html:`
     <ul><li>Binding mellom <b>metaller</b>. Sterk binding.</li>
     <li>Metaller har <b>få valenselektroner</b> og gir dem lett fra seg.</li>
     <li>Elektronene beveger seg fritt mellom atomene og danner en <b>elektronsjø</b>.</li>
     <li>Kreftene mellom elektronsjøen og de <b>positive ionene</b> = metallbinding.</li></ul>`},
   {id:'metegenskaper', title:'Egenskaper og forklaringer', html:`
     <div class="scroll-x"><table class="ftab"><tr><th>Egenskap</th><th>Forklaring</th></tr>
     <tr><td>Leder strøm godt</td><td>Frie elektroner kan bevege seg</td></tr>
     <tr><td>Leder varme godt</td><td>Frie elektroner overfører energi raskt</td></tr>
     <tr><td>Formbar</td><td>Lag av ioner kan gli forbi hverandre, og elektronsjøen holder dem sammen</td></tr></table></div>
     <p>Metaller leder strøm også som <b>fast stoff</b>, i motsetning til salter.</p>`},
   {id:'legering', title:'Legeringer', html:`
     <ul><li>En <b>legering</b> er en blanding av metaller (ofte med litt av andre grunnstoffer).</li>
     <li><b>Stål</b>: jern tilsatt karbon.</li>
     <li><b>Rustfritt stål</b>: jern tilsatt både karbon og krom.</li></ul>`},
   {id:'fremstilling', title:'Fremstilling og resirkulering', html:`
     <ul><li>Bare <b>edelmetaller</b> (gull, sølv, platina) finnes rene i naturen.</li>
     <li>Ellers finnes metaller som <b>positive ioner i salter</b>, også kalt <b>mineraler</b>.</li>
     <li>Å utvinne metallet krever <b>mye energi</b> og kan gi store utslipp. Det er en stor belastning for miljøet.</li>
     <li><b>Resirkulering</b> er viktig – det finnes ikke uendelig med metaller i jorda.</li></ul>`}
  ],
  lab:['sjo'],
  qs:[
   {t:'mc',q:'Hva er metallbinding?',o:['Kreftene mellom positive metallioner og elektronsjøen','Deling av elektronpar mellom to ikke-metaller','Tiltrekning mellom Na⁺ og Cl⁻','Svak binding mellom molekyler'],a:0,why:'Metallbinding = tiltrekning mellom metallionene og de frie elektronene.',f:'metallbinding'},
   {t:'mc',q:'Hva er «elektronsjøen»?',o:['Valenselektroner som beveger seg fritt mellom metallionene','Elektroner som sitter fast i kjernen','Vann som inneholder elektroner','Positive ioner i et gitter'],a:0,why:'Metallatomene gir fra seg valenselektroner som flyter fritt.',f:'metallbinding'},
   {t:'tf',q:'Metaller har mange valenselektroner som de holder hardt på.',a:false,why:'Metaller har få valenselektroner og gir dem lett fra seg.',f:'metallbinding'},
   {t:'mc',q:'Hvorfor leder metaller strøm godt?',o:['De frie elektronene kan bevege seg gjennom metallet','Metallene inneholder ioner som beveger seg','Metallene har mange protoner','Metallene er harde'],a:0,why:'Koble til et batteri i simuleringen og se elektronene drive.',f:'metegenskaper'},
   {t:'mc',q:'Hvorfor er metaller formbare?',o:['Lagene av ioner kan gli forbi hverandre uten at bindingen brytes, fordi elektronsjøen holder dem sammen','Metallene består av små molekyler','Metallene er hule','Bindingene mellom atomene er svake'],a:0,why:'Prøv hammeren i simuleringen: lagene forskyves, men elektronsjøen holder sammen.',f:'metegenskaper'},
   {t:'tf',q:'Faste metaller leder strøm.',a:true,why:'Elektronsjøen finnes også i fast metall. (Salter leder ikke strøm som fast stoff.)',f:'metegenskaper'},
   {t:'tf',q:'Salter leder strøm i fast form, akkurat som metaller.',a:false,why:'Ionene i et salt sitter fast i gitteret. Metaller har frie elektroner.',f:'metegenskaper'},
   {t:'mt',q:'Kople egenskapen med forklaringen.',l:[['Leder strøm','Frie elektroner kan bevege seg'],['Er formbar','Lag av ioner glir uten at bindingen brytes'],['Leder varme','Elektronene overfører energi raskt']],why:'Alt kommer fra elektronsjøen.',f:'metegenskaper'},
   {t:'mc',q:'Hva er en legering?',o:['En blanding av metaller (og eventuelt andre grunnstoffer)','Et rent grunnstoff','Et salt','Et molekyl'],a:0,why:'Stål og rustfritt stål er legeringer.',f:'legering'},
   {t:'cz',q:'Stål er jern tilsatt {0}. Rustfritt stål er jern tilsatt karbon og {1}.',b:[{o:['gull','natrium','karbon'],a:2},{o:['krom','kalsium','klor'],a:0}],why:'Stål = jern + karbon. Rustfritt stål = jern + karbon + krom.',f:'legering'},
   {t:'mc',q:'Hvilke metaller finnes rene i naturen?',o:['Edelmetaller som gull, sølv og platina','Natrium og kalium','Jern og aluminium','Alle metaller'],a:0,why:'De fleste metaller er positive ioner i salter (mineraler).',f:'fremstilling'},
   {t:'mc',q:'I naturen finnes de fleste metaller som …',o:['positive ioner i salter (mineraler)','frie atomer','negative ioner','gasser'],a:0,why:'Metallene må utvinnes fra mineralene, og det krever mye energi.',f:'fremstilling'},
   {t:'mc',q:'Hvorfor er resirkulering av metaller viktig?',o:['Utvinning krever mye energi og gir store utslipp, og metaller er en begrenset ressurs','Metaller blir gamle','Det er ulovlig å kaste metall','Metaller løser seg i vann'],a:0,why:'Resirkulering sparer energi og miljø, og bevarer ressursene.',f:'fremstilling'}
  ]},

{ id:'mix', sym:'O', z:8, hue:'var(--h-mix)', num:'2.2–2.5',
  title:'Alle bindingstypene samlet',
  goal:'Du skal kunne sammenligne ionebinding, kovalent binding, metallbinding og de svake bindingene mellom molekyler.',
  facts:[
   {id:'oversikt', title:'Oversikt over alle bindingene', html:`
     <div class="scroll-x"><table class="ftab"><tr><th>Binding</th><th>Mellom</th><th>Hva skjer</th><th>Egenskaper</th></tr>
     <tr><td>Ione-binding</td><td>metall + ikke-metall</td><td>+ og − ioner tiltrekker hverandre</td><td>høye smelte-/kokepunkt, sprø, leder i løsning</td></tr>
     <tr><td>Kovalent</td><td>ikke-metall + ikke-metall</td><td>deler elektronpar</td><td>ofte lave smelte-/kokepunkt</td></tr>
     <tr><td>Metall-binding</td><td>metall + metall</td><td>elektronsjø + positive ioner</td><td>leder strøm og varme, formbar</td></tr>
     <tr><td>Dipol- og hydrogenbinding</td><td>mellom molekyler</td><td>+ og − sider tiltrekker</td><td>svake; forklarer vannets egenskaper</td></tr></table></div>`},
   {id:'trinn', title:'Slik finner du bindingstypen', html:`
     <ol><li>Se på atomene i periodesystemet. Er de metall eller ikke-metall?</li>
     <li>Metall + ikke-metall → <b>ionebinding</b>.</li><li>Ikke-metall + ikke-metall → <b>kovalent binding</b>.</li><li>Metall + metall → <b>metallbinding</b>.</li>
     <li>Molekyler med H bundet til O, F eller N kan i tillegg ha <b>hydrogenbindinger</b> <em>mellom</em> molekylene.</li></ol>`}
  ],

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
const SUPM={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁺':'+','⁻':'−'};
const SUPD='⁰¹²³⁴⁵⁶⁷⁸⁹', SUBD='₀₁₂₃₄₅₆₇₈₉';
function fmt(s){
  return String(s)
    .replace(/[₀-₉]+/g, m=>'<sub>'+[...m].map(c=>c.charCodeAt(0)-8320).join('')+'</sub>')
    .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻]+/g, m=>'<sup>'+[...m].map(c=>SUPM[c]).join('')+'</sup>');
}
const plain = s => String(s).replace(/<[^>]+>/g,'');
function subd(n){ return n>1 ? [...String(n)].map(d=>SUBD[+d]).join('') : ''; }
function supCharge(c){ const a=Math.abs(c); return (a>1?[...String(a)].map(d=>SUPD[+d]).join(''):'')+(c>0?'⁺':'⁻'); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function gcd(a,b){ return b?gcd(b,a%b):a; }
const SUPTO={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁺':'+','⁻':'-'};
function nz(s, cs){
  s = String(s).replace(/[₀-₉]/g,c=>c.charCodeAt(0)-8320).replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻]/g,c=>SUPTO[c])
       .replace(/[−–—]/g,'-').replace(/[\s.]/g,'');
  if(!cs) s = s.replace(/-/g,'').toLowerCase();
  return s;
}

function fillCz(q){ return q.q.replace(/\{(\d+)\}/g,(m,i)=>'<b>'+q.b[i].o[q.b[i].a]+'</b>'); }
function ansHTML(q){
  switch(q.t){

function bMC(q, body, tf){
  const opts = tf ? ['Sant','Usant'] : q.o;
  const correct = tf ? (q.a?0:1) : q.a;
  const order = tf ? [0,1] : shuffle(opts.map((_,i)=>i));
  let sel=null;
  const list=el('div', tf?'tfrow':'opts'); list.setAttribute('role','radiogroup');
  const btns=order.map(i=>{
    const b=el('button','opt',fmt(opts[i])); b.type='button'; b.setAttribute('role','radio'); b.setAttribute('aria-checked','false'); b.dataset.i=i;

    list.appendChild(b); return b;
  });
  body.appendChild(list);
  return {
    check(){ if(sel==null) return {complete:false,msg:'Velg et svar først.'}; const ok=sel===correct;
      btns.forEach(x=>{ if(+x.dataset.i===sel) x.classList.add(ok?'ok':'no'); }); return {complete:true,ok}; },

    reset(){ sel=null; btns.forEach(x=>{ x.setAttribute('aria-checked','false'); x.classList.remove('ok','no'); }); }
  };
}

      const dn=el('button',null,'↓'); dn.type='button'; dn.setAttribute('aria-label','Flytt ned'); dn.disabled=pos===n-1;
      up.onclick=()=>{ [order[pos-1],order[pos]]=[order[pos],order[pos-1]]; render({pos:pos-1,b:0}); };
      dn.onclick=()=>{ [order[pos+1],order[pos]]=[order[pos],order[pos+1]]; render({pos:pos+1,b:1}); };
      mv.append(up,dn); li.appendChild(mv); ul.appendChild(li);
    });
    if(focus){ const b=ul.children[focus.pos].querySelectorAll('button')[focus.b]; if(b&&!b.disabled) b.focus(); else if(b) ul.children[focus.pos].querySelectorAll('button')[1-focus.b].focus(); }
  }
  render();
  return {
    check(){ let right=0; [...ul.children].forEach((li,pos)=>{ const ok=order[pos]===pos; li.classList.remove('ok','no'); li.classList.add(ok?'ok':'no'); if(ok) right++; });
      return {complete:true,ok:right===n,right,total:n}; },
    reveal(){ order=q.items.map((_,i)=>i); render(); [...ul.children].forEach(li=>li.classList.add('ok')); },
    reset(){ reshuffle(); render(); }
  };
}
function bPI(q, body){
  const grid=el('div','pgrid'); const cards=[];
  const names=shuffle(PICTS.map(p=>({v:p.k,t:p.n})));
  shuffle(PICTS).forEach(p=>{
    const c=el('div','pc',pictSVG(p.k)); const s=mkSelect(names); s.setAttribute('aria-label','Navn på farepiktogram'); c.appendChild(s); grid.appendChild(c); cards.push({c,s,p});
  });
  body.appendChild(grid);
  return {
    check(){ if(cards.some(x=>x.s.value==='')) return {complete:false,msg:'Velg navn på alle piktogrammene.'};
      let right=0; cards.forEach(x=>{ const ok=x.s.value===x.p.k; x.c.classList.remove('ok','no'); x.c.classList.add(ok?'ok':'no'); if(ok) right++; });
      return {complete:true,ok:right===cards.length,right,total:cards.length}; },
    reveal(){ cards.forEach(x=>{ x.s.value=x.p.k; x.c.classList.remove('no'); x.c.classList.add('ok'); }); },
    reset(){ cards.forEach(x=>{ x.s.value=''; x.c.classList.remove('ok','no'); }); }
  };
}

let bannerHook=null; // settes av seksjonsvisning
function makeQ(q, ctx){
  const {sec,id,num,store,quiz}=ctx;
  const card=el('article','q'); card.style.setProperty('--hue',sec.hue);
  const head=el('div','q-h'); head.appendChild(el('div','q-n',num));
  const lead=q.t==='cz' ? 'Velg riktig ord i hver luke.' : q.q;
  head.appendChild(el('div','q-t', fmt(lead)+(quiz?'<span class="tag">'+fmt(sec.title)+'</span>':'')));
  card.appendChild(head);
  const body=el('div','q-b'); card.appendChild(body);
  let api;
  if(q.t==='mc') api=bMC(q,body,false); else if(q.t==='tf') api=bMC(q,body,true);
  else if(q.t==='in') api=bIN(q,body); else if(q.t==='cz') api=bCZ(q,body);
  else if(q.t==='mt') api=bMT(q,body); else if(q.t==='so') api=bSO(q,body);
  else if(q.t==='or') api=bOR(q,body); else if(q.t==='pi') api=bPI(q,body);

  const act=el('div','q-a');
  const bCheck=el('button','btn pri','Sjekk svar'); bCheck.type='button';
  const bShow=el('button','btn','Vis fasit'); bShow.type='button';
  const bReset=el('button','btn ghost','Prøv på nytt'); bReset.type='button'; bReset.hidden=true;
  act.append(bCheck,bShow,bReset); card.appendChild(act);
  const fb=el('div','fb'); fb.setAttribute('role','status'); fb.setAttribute('aria-live','polite'); card.appendChild(fb);

  const lock=v=>{ $$('button,input,select',body).forEach(x=>x.disabled=v); bCheck.disabled=v; bShow.disabled=v; };
  const chip=()=>{ if(!q.f) return ''; const f=sec.facts.find(x=>x.id===q.f); return f?'<div><button type="button" class="fchip" data-f="'+sec.id+'/'+f.id+'">Les faktaboksen: '+fmt(f.title)+'</button></div>':''; };
  const setState=st=>{ card.classList.remove('ok','no'); if(st==='ok') card.classList.add('ok'); if(st==='no') card.classList.add('no'); };
  const finish=(st)=>{ if(st){ store.q[id]=st; } else delete store.q[id]; if(!quiz) save(); ctx.onChange&&ctx.onChange(); };
  const showOk=()=>{ fb.innerHTML='<div class="v ok"><b>Riktig!</b> '+fmt(q.why)+'</div>'; };
  const showRv=()=>{ fb.innerHTML='<div class="v rv"><b>Fasit:</b> '+ansHTML(q)+(q.t==='cz'?'':'')+'<div style="margin-top:6px">'+fmt(q.why)+'</div></div>'+chip(); };

  bCheck.onclick=()=>{
    const r=api.check();
    if(!r.complete){ fb.innerHTML='<div class="v no">'+r.msg+'</div>'; return; }
    if(r.ok){ setState('ok'); lock(true); bReset.hidden=false; showOk(); finish('ok'); }
    else{
      setState('no'); bReset.hidden=false;
      store.miss[sec.id]=(store.miss[sec.id]||0)+1; if(!quiz) save();
      const part = r.total ? ' Du har '+r.right+' av '+r.total+' riktige.' : '';
      fb.innerHTML='<div class="v no"><b>Ikke helt.</b>'+part+' Endre svaret og sjekk igjen, eller trykk «Vis fasit».</div>'+chip();
      if(!quiz && bannerHook) bannerHook(sec);
      ctx.onChange&&ctx.onChange();
    }
  };
  bShow.onclick=()=>{ api.reveal(); setState(null); lock(true); bReset.hidden=false; showRv(); finish('rv'); };
  bReset.onclick=()=>{ api.reset(); lock(false); setState(null); fb.innerHTML=''; bReset.hidden=true; finish(null); };
  if(api.onEnter) api.onEnter(()=>bCheck.click());

  const st=store.q[id];
  if(st){ api.reveal(); lock(true); bReset.hidden=false; if(st==='ok'){ setState('ok'); showOk(); } else showRv(); }
  return card;
}

function shellsOf(z){
  const caps=[2,8,8,18]; let left=z, s=[];
  for(const c of caps){ if(left<=0) break; const take=Math.min(c,left); s.push(take); left-=take; }
  return s;
}

      '<tr><th>Gruppe</th><td>'+e.grp+(e.grp>=13?' ('+(e.grp-10)+')':'')+'</td></tr>'+
      '<tr><th>Periode</th><td>'+e.per+'</td></tr>'+
      '<tr><th>Elektronfordeling</th><td>'+sh.join(', ')+'</td></tr>'+
      '<tr><th>Valenselektroner</th><td>'+val+'</td></tr>';
    const trenger=8-val;
    msg.className='msg'+(val===8||e.z<=2&&val===2?' good':'');
    msg.textContent = (val===8||(e.z===2&&val===2)) ? e.navn+' har full ytterste skall – en edelgass!' :
      e.type==='m' ? e.navn+' er et metall. Gir lett fra seg '+val+' elektron'+(val>1?'er':'')+' for å få full skall.' :
      e.navn+' er et ikke-metall. Trenger '+trenger+' elektron'+(trenger>1?'er':'')+' til for full skall (8-regelen).';
    drawAtom(svgbox, e, sh);
  }
  select(cur);
}
function drawAtom(box, e, shells){
  const cx=170, cy=170, r0=26, step=34;
  let s='<svg viewBox="0 0 340 340" role="img" aria-label="Skallmodell av '+e.navn+'"><circle cx="'+cx+'" cy="'+cy+'" r="'+r0+'" fill="#3E6FD1"/><text x="'+cx+'" y="'+(cy+6)+'" text-anchor="middle" fill="#fff" font-weight="800" font-size="17">'+e.sym+'</text>';
  shells.forEach((n,idx)=>{
    const rad=r0+step*(idx+1);
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+rad+'" fill="none" stroke="#9FB2C8" stroke-width="1.5" stroke-dasharray="3 4"/>';
    for(let i=0;i<n;i++){ const a=(2*Math.PI*i/n)-Math.PI/2; const x=cx+rad*Math.cos(a), y=cy+rad*Math.sin(a);
      s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="6.5" fill="'+(idx===shells.length-1?'#C0562E':'#2E8B67')+'"/>'; }
  });
  s+='</svg>'; box.innerHTML=s;
}

/* ---------- Ionesimulator (2.2) ---------- */
function labAtomIon(box){
  box.innerHTML='<h2>Ionesimulatoren</h2><p class="sub">Velg et grunnstoff. Trykk «Gi fra deg elektron» eller «Ta opp elektron» og se hva som skjer med ladningen.</p>';
  const cols=el('div','lab-cols'); box.appendChild(cols);
  const left=el('div'); const chips=el('div','chips');
  const pool=ELESET.filter(e=>e.type!=='e');
  pool.forEach(e=>{ const c=el('button','chip',e.sym); c.type='button'; c.onclick=()=>select(e); chips.appendChild(c); });
  left.appendChild(chips);
  const row=el('div','row');
  const give=el('button','btn','Gi fra deg elektron ↑'); give.type='button';
  const take=el('button','btn','Ta opp elektron ↓'); take.type='button';
  const rst=el('button','btn ghost','Nullstill'); rst.type='button';
  row.append(give,take,rst); left.appendChild(row);
  const ionRow=el('div','row'); left.appendChild(ionRow);
  const msg=el('div','msg'); left.appendChild(msg);
  cols.appendChild(left);
  const svgbox=el('div','svgbox'); cols.appendChild(svgbox);
  let cur, charge=0;
  function select(e){ cur=e; charge=0; $$('.chip',chips).forEach(c=>c.setAttribute('aria-pressed', String(c.textContent===e.sym))); render(); }
  function render(){
    const sh=shellsOf(cur.z); let arr=sh.slice();
    if(charge>0){ for(let i=0;i<charge;i++){ if(arr[arr.length-1]>0) arr[arr.length-1]--; if(arr[arr.length-1]===0) arr.pop(); } }
    if(charge<0){ let need=-charge; arr[arr.length-1]=(arr[arr.length-1]||0)+need; }
    const label = charge===0? cur.navn+' (nøytralt atom)' : cur.sym+supCharge(charge)+' — '+cur.navn+(charge>0?'ion (positivt)':'ion (negativt)');
    ionRow.innerHTML='<span class="ion '+(charge>0?'pos':charge<0?'neg':'')+'" style="background:'+(charge===0?'#8A97A8':charge>0?'#3E6FD1':'#C0562E')+'">'+fmt(cur.sym+(charge?supCharge(charge):''))+'</span><b>'+label+'</b>';
    const val=arr[arr.length-1];
    msg.className='msg'+(val===8||val===2&&arr.length===1?' good':'');
    msg.textContent = val===8||(val===2&&arr.length===1) ? 'Full ytterste skall! Oktettregelen er oppfylt.' : 'Ytterste skall har '+val+' elektron'+(val===1?'':'er')+' – ikke stabilt ennå.';
    drawAtom(svgbox, cur, arr);
    give.disabled = (arr[arr.length-1]||0)<=0 && arr.length<=1;
  }
  give.onclick=()=>{ charge++; render(); };
  take.onclick=()=>{ charge--; render(); };
  rst.onclick=()=>{ charge=0; render(); };
  select(pool.find(e=>e.sym==='Na'));
}

/* ---------- Ledeevne-tester (2.3) ---------- */
function labLed(box){
  box.innerHTML='<h2>Testeren: leder det strøm?</h2><p class="sub">Velg et stoff og en tilstand, og se om lyspæren tenner.</p>';
  const cols=el('div','lab-cols'); box.appendChild(cols);
  const left=el('div','tester');
  const STOFF=[
    {k:'nacl-s',n:'NaCl – fast salt',on:false,why:'Ionene sitter fast i gitteret og kan ikke bevege seg.'},
    {k:'nacl-l',n:'NaCl – smeltet',on:true,why:'I smeltet form kan ionene bevege seg fritt og frakte strøm.'},
    {k:'nacl-aq',n:'NaCl – oppløst i vann',on:true,why:'Ionene er løsrevet fra gitteret og beveger seg fritt i vannet.'},
    {k:'fe-s',n:'Jern (metall) – fast',on:true,why:'Metaller har en elektronsjø av frie elektroner, selv i fast form.'},
    {k:'h2o',n:'Rent vann',on:false,why:'Rent vann har svært få frie ioner og leder strøm dårlig.'},
    {k:'sukker-aq',n:'Sukker oppløst i vann',on:false,why:'Sukker er en kovalent forbindelse. Det danner ingen ioner i vann.'}
  ];
  const sel=mkSelect(STOFF.map(s=>({v:s.k,t:s.n}))); sel.setAttribute('aria-label','Velg stoff'); left.appendChild(sel);
  const res=el('div','res off','Velg et stoff for å teste'); left.appendChild(res);
  cols.appendChild(left);
  const svgbox=el('div','svgbox');
  svgbox.innerHTML='<svg viewBox="0 0 200 140" role="img" aria-label="Krets med lyspære"><rect x="20" y="90" width="30" height="18" rx="3" fill="#333"/><line x1="35" y1="90" x2="35" y2="60" stroke="#333" stroke-width="3"/><line x1="10" y1="60" x2="60" y2="60" stroke="#333" stroke-width="3"/><line x1="10" y1="60" x2="10" y2="30" stroke="#333" stroke-width="3"/><line x1="60" y1="60" x2="60" y2="30" stroke="#333" stroke-width="3"/><circle id="bulbc" class="glass" cx="35" cy="20" r="16" stroke="#333" stroke-width="2"/><line x1="27" y1="26" x2="43" y2="14" stroke="#333" stroke-width="2"/><line x1="27" y1="14" x2="43" y2="26" stroke="#333" stroke-width="2"/></svg>';
  cols.appendChild(svgbox);
  sel.onchange=()=>{
    const s=STOFF.find(x=>x.k===sel.value); if(!s) return;
    $('#bulbc',svgbox).setAttribute('fill', s.on?'#FFD23F':'#8A97A8');
    $('#bulbc',svgbox).style.filter = s.on?'drop-shadow(0 0 10px #FFC400)':'none';
    res.className='res '+(s.on?'on':'off'); res.textContent=(s.on?'Lyser! ':'Lyser ikke. ')+s.why;
  };
}

/* ---------- Salt-bygger (2.3) ---------- */
function labSalt(box){
  box.innerHTML='<h2>Saltbyggeren</h2><p class="sub">Velg et metall og et ikke-metall. Simulatoren finner riktig formel med kryssregelen.</p>';
  const cols=el('div','lab-cols'); box.appendChild(cols);
  const M=[{s:'Na',n:'Natrium',c:1},{s:'K',n:'Kalium',c:1},{s:'Mg',n:'Magnesium',c:2},{s:'Ca',n:'Kalsium',c:2},{s:'Al',n:'Aluminium',c:3}];
  const X=[{s:'Cl',n:'Klor',id:'klorid',c:-1},{s:'F',n:'Fluor',id:'fluorid',c:-1},{s:'O',n:'Oksygen',id:'oksid',c:-2},{s:'S',n:'Svovel',id:'sulfid',c:-2},{s:'N',n:'Nitrogen',id:'nitrid',c:-3}];
  const left=el('div');
  const r1=el('div','row'); r1.appendChild(el('span',null,'Metall:'));
  const s1=mkSelect(M.map(m=>({v:m.s,t:m.n+' ('+m.s+supCharge(m.c)+')'}))); s1.setAttribute('aria-label','Velg metall'); s1.value=M[0].s; r1.appendChild(s1); left.appendChild(r1);
  const r2=el('div','row'); r2.appendChild(el('span',null,'Ikke-metall:'));
  const s2=mkSelect(X.map(x=>({v:x.s,t:x.n+' ('+x.s+supCharge(x.c)+')'}))); s2.setAttribute('aria-label','Velg ikke-metall'); s2.value=X[0].s; r2.appendChild(s2); left.appendChild(r2);
  const out=el('div'); out.style.marginTop='14px'; left.appendChild(out);
  cols.appendChild(left);
  const svgbox=el('div','svgbox'); cols.appendChild(svgbox);
  function build(){
    const m=M.find(x=>x.s===s1.value), x=X.find(x=>x.s===s2.value);
    const g=gcd(m.c,-x.c); const nm=(-x.c)/g, nx=m.c/g;
    const formula = m.s+(nm>1?subd(nm):'')+x.s+(nx>1?subd(nx):'');
    const navn=m.n.toLowerCase()+x.id;
    out.innerHTML='<div class="big">'+fmt(formula)+'</div><p style="margin-top:6px">Navn: <b>'+navn+'</b></p>'+
      '<p class="kbd">'+nm+'× '+m.s+supCharge(m.c)+'  ('+(m.c*nm>0?'+':'')+(m.c*nm)+')  +  '+nx+'× '+x.s+supCharge(x.c)+'  ('+(x.c*nx)+')  =  0</p>';
    let ions=''; for(let i=0;i<nm;i++) ions+='<span class="ion pos">'+fmt(m.s+supCharge(m.c))+'</span> ';
    for(let i=0;i<nx;i++) ions+='<span class="ion neg">'+fmt(x.s+supCharge(x.c))+'</span> ';
    svgbox.innerHTML='<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;min-height:200px">'+ions+'</div>';
  }
  s1.onchange=build; s2.onchange=build; build();
}

/* ---------- Molekylbygger (2.4) ---------- */
function labMol(box){
  box.innerHTML='<h2>Molekylbyggeren</h2><p class="sub">Velg et molekyl og se hvor mange elektronpar atomene deler.</p>';
  const MOLS=[
    {k:'cl2',n:'Cl₂',bonds:1,atoms:['Cl','Cl'],why:'Klor har 7 valenselektroner og trenger 1 til: enkeltbinding.'},
    {k:'o2',n:'O₂',bonds:2,atoms:['O','O'],why:'Oksygen har 6 valenselektroner og trenger 2 til: dobbeltbinding.'},
    {k:'n2',n:'N₂',bonds:3,atoms:['N','N'],why:'Nitrogen har 5 valenselektroner og trenger 3 til: trippelbinding.'},
    {k:'hcl',n:'HCl',bonds:1,atoms:['H','Cl'],why:'Hydrogen og klor deler ett elektronpar. Bindingen er polar – klor trekker mest.'},
    {k:'h2o',n:'H₂O',bonds:1,atoms:['H','O','H'],why:'Oksygen danner to enkeltbindinger, en til hvert hydrogenatom.'}
  ];
  const cols=el('div','lab-cols'); box.appendChild(cols);
  const left=el('div'); const chips=el('div','chips');
  MOLS.forEach(m=>{ const c=el('button','chip',fmt(m.n)); c.type='button'; c.onclick=()=>select(m); chips.appendChild(c); });
  left.appendChild(chips);
  const info=el('div','msg'); left.appendChild(info);
  cols.appendChild(left);
  const svgbox=el('div','svgbox'); cols.appendChild(svgbox);
  function select(m){
    $$('.chip',chips).forEach(c=>c.setAttribute('aria-pressed', String(c.textContent===plain(fmt(m.n)))));
    info.className='msg good';
    const navn=m.bonds===1?'Enkeltbinding':m.bonds===2?'Dobbeltbinding':'Trippelbinding';
    info.innerHTML='<b>'+navn+'</b> — '+m.why;
    const n=m.atoms.length; const cx=[80,200,320].slice(0,n);
    let s='<svg viewBox="0 0 400 140" role="img" aria-label="Molekyl '+m.n+'">';
    for(let i=0;i<n-1;i++){ for(let b=0;b<m.bonds;b++){ const off=(b-(m.bonds-1)/2)*7;
      s+='<line x1="'+(cx[i]+30)+'" y1="'+(70+off)+'" x2="'+(cx[i+1]-30)+'" y2="'+(70+off)+'" stroke="#2E8B67" stroke-width="4"/>'; } }
    m.atoms.forEach((a,i)=>{ s+='<circle cx="'+cx[i]+'" cy="70" r="30" fill="#3E6FD1"/><text x="'+cx[i]+'" y="77" text-anchor="middle" fill="#fff" font-weight="800" font-size="20">'+a+'</text>'; });
    s+='</svg>'; svgbox.innerHTML=s;
  }
  select(MOLS[0]);
}

/* ---------- Navnebygger (Navnsetting) ---------- */
function labNavn(box){
  box.innerHTML='<h2>Navnebyggeren</h2><p class="sub">Velg antall og grunnstoff for hver del, og sett sammen navnet på en molekylforbindelse.</p>';
  const TALL=['','mono','di','tri','tetra','penta','heksa','hepta','okta','nona','deka'];
  const A=[{s:'N',n:'nitrogen'},{s:'C',n:'karbon'},{s:'S',n:'svovel'},{s:'P',n:'fosfor'},{s:'H',n:'hydrogen'}];
  const B=[{s:'O',n:'oksid'},{s:'Cl',n:'klorid'},{s:'F',n:'fluorid'},{s:'S',n:'sulfid'}];
  const cols=el('div','lab-cols'); box.appendChild(cols);
  const left=el('div');
  function rowSel(label,opts,def){ const r=el('div','row'); r.appendChild(el('span',null,label)); const s=mkSelect(opts); s.setAttribute('aria-label',label); s.value=(def!=null?def:opts[0].v); r.appendChild(s); left.appendChild(r); return s; }
  const n1=rowSel('Antall av første grunnstoff:', TALL.map((t,i)=>({v:i,t:i===0?'(ingen tall)':i+' – '+t})),'2');
  const g1=rowSel('Første grunnstoff:', A.map(a=>({v:a.s,t:a.n})),'N');
  const n2=rowSel('Antall av andre grunnstoff:', TALL.map((t,i)=>({v:i,t:i===0?'—':i+' – '+t})).slice(1),'3');
  const g2=rowSel('Andre grunnstoff:', B.map(b=>({v:b.s,t:b.n})),'O');
  const out=el('div'); out.style.marginTop='10px'; left.appendChild(out);
  cols.appendChild(left);
  const right=el('div'); right.innerHTML='<p class="kbd">Husk: tallordet «mono» sløyfes foran det <em>første</em> grunnstoffet, men brukes foran «oksid» osv. for det andre.</p>';
  cols.appendChild(right);
  function build(){
    const a=A.find(x=>x.s===g1.value), b=B.find(x=>x.s===g2.value);
    const i1=+n1.value, i2=+n2.value;
    const pre1 = i1<=1?'':TALL[i1];
    const pre2 = TALL[i2];
    const formula = a.s+(i1>1?subd(i1):'')+b.s+(i2>1?subd(i2):'');
    const navn = pre1+a.n+' '+pre2+b.n;
    out.innerHTML='<div class="big">'+fmt(formula)+'</div><p style="margin-top:6px">Navn: <b>'+navn.replace(/\s+/g,'')+'</b></p>';
  }
  [n1,g1,n2,g2].forEach(s=>s.onchange=build); build();
}

/* ---------- Elektronsjø / formbarhet (2.5) ---------- */
function labSjo(box){
  box.innerHTML='<h2>Elektronsjøen</h2><p class="sub">Koble til batteriet for å se elektronene bevege seg, eller bruk hammeren for å se hvorfor metaller er formbare.</p>';
  const cols=el('div','lab-cols'); box.appendChild(cols);
  const left=el('div');
  const row=el('div','row');
  const bBatt=el('button','btn','⚡ Koble til batteri'); bBatt.type='button';
  const bHam=el('button','btn','🔨 Slå med hammer'); bHam.type='button';
  const bRst=el('button','btn ghost','Nullstill'); bRst.type='button';
  row.append(bBatt,bHam,bRst); left.appendChild(row);
  const msg=el('div','msg'); left.appendChild(msg);
  cols.appendChild(left);
  const svgbox=el('div','svgbox'); cols.appendChild(svgbox);
  const cols_ = 6, rows_=4, pts=[];
  for(let r=0;r<rows_;r++) for(let c=0;c<cols_;c++) pts.push({x:30+c*45,y:30+r*38,dx:0,dy:0});
  let mode='idle', t=0, raf=null;
  function draw(){
    let s='<svg viewBox="0 0 300 190" role="img" aria-label="Elektronsjø-simulering"><rect x="0" y="0" width="300" height="190" fill="none"/>';
    pts.forEach(p=>{ s+='<circle cx="'+(p.x+p.dx).toFixed(1)+'" cy="'+(p.y+p.dy).toFixed(1)+'" r="10" fill="#9FB2C8" opacity="0.85"/>'; });
    if(mode==='batt'){
      for(let i=0;i<10;i++){ const x=(20+ (t*40+i*30)%280); s+='<circle cx="'+x.toFixed(1)+'" cy="'+(30+((i*37)%150)).toFixed(1)+'" r="4" fill="#3E6FD1"/>'; }
    } else {
      pts.forEach(p=>{ s+='<circle cx="'+(p.x+p.dx).toFixed(1)+'" cy="'+(p.y+p.dy).toFixed(1)+'" r="4" fill="#C0562E" opacity="0.9"/>'; });
    }
    s+='</svg>'; svgbox.innerHTML=s;
  }
  function loop(){ t+=0.15; if(mode==='batt'){ draw(); raf=requestAnimationFrame(loop); } }
  bBatt.onclick=()=>{ mode='batt'; msg.className='msg good'; msg.textContent='De frie elektronene («elektronsjøen») beveger seg gjennom metallet — det er derfor metaller leder strøm.'; cancelAnimationFrame(raf); loop(); };
  bHam.onclick=()=>{ mode='hammer'; cancelAnimationFrame(raf);
    pts.forEach((p,i)=>{ const row=Math.floor(i/cols_); p.dx = row%2===0?26:0; });
    draw();
    msg.className='msg good'; msg.textContent='Lagene av positive ioner glir forbi hverandre. Elektronsjøen flyter fritt og holder metallet sammen likevel — derfor bøyer metallet seg i stedet for å knuse, slik salter gjør.';
  };
  bRst.onclick=()=>{ mode='idle'; cancelAnimationFrame(raf); pts.forEach(p=>{p.dx=0;p.dy=0;}); msg.className='msg'; msg.textContent=''; draw(); };
  draw();
}
renderNav(); route();
